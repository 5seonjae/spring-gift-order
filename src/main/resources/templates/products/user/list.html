<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>상품 목록</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div class="container">
  <h1>상품 <strong>목록</strong></h1>

  <div th:if="${errorMsg}" class="alert alert-danger" role="alert">
    <p th:text="${errorMsg}"></p>
  </div>

  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>상품명</th>
      <th>가격</th>
      <th>이미지</th>
      <th>상세</th>
      <th>관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${page.content}">
      <td th:text="${product.id}">1</td>
      <td th:text="${product.name}">상품명</td>
      <td th:text="${product.price}"></td>
      <td><img th:src="${product.imageUrl}" width="80" /></td>
      <td><a th:href="@{'/products/' + ${product.id}}">상세보기</a></td>
      <td class="actions">
        <!-- 🆕 Wish 추가 폼 -->
        <form th:action="@{'/wishes/' + ${product.id}}" method="post" style="display:inline">
          <button type="submit">🤍 찜</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <nav class="pagination">
    <!-- Prev -->
    <a class="page-link"
       th:href="${page.first}
             ? null
             : @{/products(page=${page.number-1},size=${page.size})}"
       th:classappend="${page.first} ? ' disabled'">
      Prev
    </a>

    <!-- 페이지 번호 -->
    <a th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
       th:href="@{/products(page=${i},size=${page.size})}"
       th:classappend="${page.number == i} ? 'active'"
       class="page-link"
       th:text="${i + 1}">
      1
    </a>

    <!-- Next -->
    <a class="page-link"
       th:href="${page.last}
             ? null
             : @{/products(page=${page.number+1},size=${page.size})}"
       th:classappend="${page.last} ? ' disabled'">
      Next
    </a>
  </nav>
</div>

<div class="button-group">
  <a th:href="@{/wishes}" class="button">← 찜 목록으로</a>
</div>

</body>
</html>
